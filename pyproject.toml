[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-preprocessing"
version = "0.1.0"
description = "M1: CT data loading and preprocessing for the ChestAI multi-abnormality classifier"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "nibabel>=5.0",
    "pyyaml>=6.0",
    "pydicom>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed only by ct_preprocessing.data.dataset (the PyTorch hand-off to M3/M4). The rest
# of this package works without torch installed -- see docs/preprocessing/data_contract.md.
torch = ["torch>=2.0"]
# Needed only if the DICOM files are compressed (JPEG / JPEG 2000).
dicom-codecs = ["pylibjpeg", "pylibjpeg-libjpeg", "pylibjpeg-openjpeg"]
dev = ["pytest>=7.0", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["src"]
