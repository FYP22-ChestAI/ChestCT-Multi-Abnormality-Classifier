[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-preprocessing"
version = "0.2.0"
description = "Chest CT preprocessing: chunked ingest of CT-RATE and local DICOM data into a raw-HU .npy cache for the ChestAI multi-abnormality classifier"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "nibabel>=5.0",
    "pyyaml>=6.0",
    "pydicom>=3.0",
    "matplotlib>=3.7",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# Only for GPU resampling (preprocess.device: cuda / auto in configs/preprocessing.yaml).
# Everything else, including the default CPU path, works without torch installed.
torch = ["torch>=2.0"]
# Needed only if the DICOM files are compressed (JPEG / JPEG 2000).
dicom-codecs = ["pylibjpeg", "pylibjpeg-libjpeg", "pylibjpeg-openjpeg"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
