# BASELINE: identical to abmil_dale2s.yaml except the aggregator is a plain masked MEAN of the projected
# slice embeddings (no attention). Every attention model must beat this to justify itself.
#
#   python scripts/model/train_mil.py --experiment abmil_dale2s [--seed 1] [--loss asl] ...
#
# Every value is a default; train_mil.py arguments override some of them. The resolved config is saved
# with the results, and its hash (without name / seed / device / paths) names the results folder.

name: meanpool_dale2s
data_config: configs/preprocessing.yaml   # cache_dir, runs_dir
encode_config: configs/model/encode.yaml  # embeddings_dir
encoder: dale_ct_2s                       # which embedding store (configs/model/encoders/dale_ct_2s.yaml)

data:
  source: ctrate
  run: train-sharp-5800
  train_kernel_classes: [sharp]           # train AND val; test is evaluated on every kernel by evaluate_mil.py
  labels: null                            # null = every label_* column of the manifest (18 for CT-RATE)
  qc_passed_only: true
  train_slice_sampler: {mode: all}        # bag augmentation: all | stride | uniform_k | random_k (ct_model.data.slices)
  preload: true                           # bags in RAM: ~3.3 GB for train + val

features:
  standardize: true                       # per-dimension mean / std, fitted on TRAIN slices only

aggregator:
  type: mean_pool                         # masked mean: the same weight on every slice
  hidden_dim: 256                         # same projection as abmil_dale2s (Linear, ReLU, Dropout)
  dropout: 0.25

head:
  type: linear
  dropout: 0.0
head_prior_bias: true                     # bias = log(p / (1 - p)), p = train prevalence per label

loss:
  type: bce                               # bce | weighted_bce (pos_weight from train) | asl (asymmetric loss)

optim:
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-2                    # weight matrices only
  batch_size: 16                          # volumes per step: ceil(5827 / 16) = 365 steps per epoch
  max_epochs: 100                         # budget: 36,500 steps; early stopping picks the epoch
  warmup_epochs: 2                        # linear warm-up, then cosine to 0 at max_epochs
  grad_clip: 1.0
  patience: 15                            # epochs without a better val macro AUROC before stopping
  monitor: val_macro_auroc

seed: 0
device: auto
output_dir: outputs/experiments
